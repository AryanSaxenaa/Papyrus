services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: papyrus
      POSTGRES_PASSWORD: papyrus
      POSTGRES_DB: papyrus
    ports:
      - "5432:5432"
    volumes:
      - papyrus_pg:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  grobid:
    image: grobid/grobid:0.8.0
    ports:
      - "8070:8070"
    deploy:
      resources:
        limits:
          memory: 4G

  api:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://papyrus:papyrus@postgres:5432/papyrus
      REDIS_URL: redis://redis:6379/0
      GROBID_URL: http://grobid:8070
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - papyrus_uploads:/app/data/uploads
    depends_on:
      - postgres
      - redis
      - grobid
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      GROBID_URL: http://grobid:8070
    depends_on:
      - redis
      - grobid
    command: celery -A app.worker.celery_app worker -l info -Q audits

volumes:
  papyrus_pg:
  papyrus_uploads:

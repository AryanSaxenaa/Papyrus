services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: papyrus
      POSTGRES_PASSWORD: papyrus
      POSTGRES_DB: papyrus
    ports:
      - "5432:5432"
    volumes:
      - papyrus_pg:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  grobid:
    image: grobid/grobid:0.8.0
    ports:
      - "8070:8070"
    deploy:
      resources:
        limits:
          memory: 4G

  # Optional: add env_file: [.env] when API keys (DeepSeek, Exa, Apify, etc.) are configured.
  api:
    build:
      context: ./backend
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql+psycopg2://papyrus:papyrus@postgres:5432/papyrus
      PERSISTENCE_BACKEND: both
      REDIS_URL: redis://redis:6379/0
      GROBID_URL: http://grobid:8070
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      CROSSREF_MAILTO: ${CROSSREF_MAILTO:-dev@localhost.invalid}
      OPENALEX_MAILTO: ${OPENALEX_MAILTO:-dev@localhost.invalid}
      UNPAYWALL_EMAIL: ${UNPAYWALL_EMAIL:-dev@localhost.invalid}
      USE_CELERY_BULK: "true"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - papyrus_uploads:/app/data/uploads
    depends_on:
      - postgres
      - redis
      - grobid
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: ./backend
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql+psycopg2://papyrus:papyrus@postgres:5432/papyrus
      PERSISTENCE_BACKEND: both
      REDIS_URL: redis://redis:6379/0
      GROBID_URL: http://grobid:8070
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      CROSSREF_MAILTO: ${CROSSREF_MAILTO:-dev@localhost.invalid}
      OPENALEX_MAILTO: ${OPENALEX_MAILTO:-dev@localhost.invalid}
      UNPAYWALL_EMAIL: ${UNPAYWALL_EMAIL:-dev@localhost.invalid}
      USE_CELERY_BULK: "true"
    volumes:
      - ./backend:/app
      - papyrus_uploads:/app/data/uploads
    depends_on:
      - postgres
      - redis
      - grobid
    command: celery -A app.worker.celery_app worker -l info -Q audits --concurrency=1

  web:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    environment:
      VITE_API_PROXY_TARGET: http://api:8000
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - api

volumes:
  papyrus_pg:
  papyrus_uploads:
